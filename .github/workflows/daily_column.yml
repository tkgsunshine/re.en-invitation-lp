name: Daily Column Automation Pipeline

on:
  schedule:
    # 毎朝 10:00 JST (UTC 01:00) に自動実行
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-column:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Column Publishing Pipeline
        run: |
          python3 run_matching_column_pipeline.py

      - name: Push changes to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-publish daily column with full regulation compliance [skip ci]"
          branch: main
