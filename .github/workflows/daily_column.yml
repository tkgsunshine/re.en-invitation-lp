name: Daily Column Automation Pipeline (Re:en)

on:
  schedule:
    # Morning Slot (JST 8:05, 8:15, 8:30 = UTC 23:05, 23:15, 23:30)
    - cron: '5 23 * * *'
    - cron: '15 23 * * *'
    - cron: '30 23 * * *'
    # Evening Slot (JST 17:05, 17:15, 17:30 = UTC 08:05, 08:15, 08:30)
    - cron: '5 8 * * *'
    - cron: '15 8 * * *'
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-column:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Column Publishing Pipeline
        run: |
          python3 run_matching_column_pipeline.py

      - name: Push changes to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-publish scheduled column with full regulation compliance [skip ci]"
          branch: main
