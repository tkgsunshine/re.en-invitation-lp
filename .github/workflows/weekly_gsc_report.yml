name: Weekly GSC Report

on:
  schedule:
    # Every Monday 9:07 JST (= Sunday 00:07 UTC), off-peak minute
    - cron: '7 0 * * 1'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-auth google-api-python-client

      - name: Generate report
        env:
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
        run: |
          if [ -z "$GSC_CREDENTIALS" ]; then
            echo "::error::Secret GSC_CREDENTIALS is not set (see docs/AI_EMPLOYEE_SETUP.md)"; exit 1
          fi
          printf '%s' "$GSC_CREDENTIALS" > gsc-credentials.json
          python3 scripts/weekly_gsc_report.py
          rm -f gsc-credentials.json

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/marketing/weekly
          git diff --cached --quiet || (git commit -m "Add weekly GSC report" && git pull --rebase origin main && git push origin main)
